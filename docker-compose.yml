services:
  # not called "app": Chromium forces https for hosts under the .app TLD
  shop:
    build: .
    ports:
      - '3000:3000'
    environment:
      ENABLE_TEST_ROUTES: 'true'
      BCRYPT_ROUNDS: '4'
      JWT_SECRET: compose-secret
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    depends_on:
      shop:
        condition: service_healthy
    environment:
      BASE_URL: http://shop:3000
      JWT_SECRET: compose-secret
      CI: ${CI:-}
    volumes:
      - ./tests/playwright-report:/app/tests/playwright-report
      - ./tests/test-results:/app/tests/test-results
      - ./tests/results:/app/tests/results
